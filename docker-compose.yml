services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskgraph
      POSTGRES_PASSWORD: taskgraph
      POSTGRES_DB: taskgraph
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["python", "-m", "app.main_api"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://taskgraph:taskgraph@postgres:5432/taskgraph
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      STORAGE_DIR: /data/artifacts
    volumes:
      - artifact_data:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    build: .
    command: ["python", "-m", "app.main_orchestrator"]
    environment:
      DATABASE_URL: postgresql://taskgraph:taskgraph@postgres:5432/taskgraph
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.main_worker"]
    environment:
      DATABASE_URL: postgresql://taskgraph:taskgraph@postgres:5432/taskgraph
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      STORAGE_DIR: /data/artifacts
    volumes:
      - artifact_data:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    # scale independently: docker compose up --scale worker=4

volumes:
  pg_data:
  artifact_data:
